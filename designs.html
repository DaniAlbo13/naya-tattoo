<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طرح‌های تتو | NAYA Tattoo</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.bar{position:sticky;top:0;z-index:20;background:#080808f2;border-bottom:1px solid #292929;padding:12px 4%;display:flex;align-items:center;gap:14px}.brand{font-weight:900;letter-spacing:2px;margin-left:auto}.nav{display:flex;gap:8px;overflow:auto}.nav a{white-space:nowrap;padding:9px 11px;border-radius:10px;color:#bbb}.nav .active{background:#222;color:#fff}.wrap{width:min(1200px,94%);margin:auto;padding:30px 0 100px}h1{font-size:clamp(32px,7vw,60px);margin:0 0 8px}.lead{color:#aaa}.tools{position:sticky;top:57px;z-index:15;background:#080808f2;padding:12px 0;display:grid;gap:10px}.search{width:100%;padding:13px;border:1px solid #333;border-radius:13px;background:#111;color:#fff}.filters{display:flex;gap:7px;overflow:auto}.filters button{white-space:nowrap;border:1px solid #333;background:#121212;color:#bbb;border-radius:999px;padding:8px 12px}.filters .on{background:#eee;color:#111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:15px}.card{background:#111;border:1px solid #282828;border-radius:15px;overflow:hidden}.pic{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#181818;cursor:zoom-in}.meta{display:flex;align-items:center;gap:8px;padding:9px}.meta strong{margin-left:auto}.pick{border:1px solid #444;background:#1b1b1b;color:#fff;padding:7px 9px;border-radius:9px}.selected{outline:2px solid #fff}.selected .pick{background:#fff;color:#111}.tray{display:none;position:fixed;z-index:30;bottom:10px;left:10px;right:10px;max-width:650px;margin:auto;background:#171717f5;border:1px solid #444;border-radius:16px;padding:10px;align-items:center;gap:8px}.tray.show{display:flex}.tray strong{margin-left:auto}.tray button{border:0;border-radius:10px;padding:10px}.primary{background:#fff;color:#111}.ghost{background:#292929;color:#fff}.modal{display:none;position:fixed;inset:0;z-index:50;background:#000e;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{width:min(94vw,650px);max-height:94vh;background:#111;border-radius:18px;overflow:auto}.modal img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#111}.modalfoot{padding:11px;display:flex;gap:8px;align-items:center}.modalfoot strong{margin-left:auto}.error{display:grid;place-items:center;aspect-ratio:3/4;color:#777;background:#141414;text-align:center;padding:10px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.tools{grid-template-columns:1fr 2fr;align-items:center}}@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}</style></head><body><header class="bar"><a class="brand" href="index.html">NAYA TATTOO</a><nav class="nav"><a href="index.html">خانه</a><a class="active" href="designs.html">طرح‌های تتو</a><a href="index.html#request">درخواست طراحی</a></nav></header><main class="wrap"><h1>۱۰۰ طرح تتو</h1><p class="lead">هر طرح یک فایل مستقل و باکیفیت دارد. شماره را جستجو کن، تصویر را بزرگ ببین و چند طرح را برای درخواست انتخاب کن.</p><section class="tools"><input class="search" id="q" inputmode="numeric" placeholder="جستجو با شماره؛ مثلاً 45"><div class="filters" id="filters"><button class="on" data-r="all">همه</button><button data-r="1">01–20</button><button data-r="2">21–40</button><button data-r="3">41–60</button><button data-r="4">61–80</button><button data-r="5">81–100</button></div></section><section class="grid" id="grid"></section></main><div class="tray" id="tray"><strong id="count"></strong><button class="ghost" id="clear">پاک کردن</button><button class="primary" id="continue">ادامه درخواست</button></div><div class="modal" id="modal"><div class="modalbox"><img id="big" alt=""><div class="modalfoot"><strong id="code"></strong><button class="primary" id="modalpick">انتخاب</button><button class="ghost" id="close">بستن</button></div></div></div><script>const grid=document.getElementById('grid'),sel=new Set(JSON.parse(localStorage.getItem('nayaSelected')||'[]'));let range='all',modalN=0;const path=n=>'assets/designs/design-'+String(n).padStart(3,'0')+'.jpg';function make(n){let c=document.createElement('article');c.className='card'+(sel.has(n)?' selected':'');c.dataset.n=n;let im=document.createElement('img');im.className='pic';im.loading=n<=8?'eager':'lazy';im.decoding='async';im.src=path(n);im.alt='طرح تتو '+String(n).padStart(3,'0');im.onerror=()=>{let e=document.createElement('div');e.className='error';e.textContent='تصویر '+String(n).padStart(3,'0')+' بارگذاری نشد';im.replaceWith(e)};im.onclick=()=>openModal(n);let m=document.createElement('div');m.className='meta';m.innerHTML='<strong>طرح '+String(n).padStart(3,'0')+'</strong><button class="pick">'+(sel.has(n)?'انتخاب شد':'انتخاب')+'</button>';m.querySelector('button').onclick=()=>toggle(n,c);c.append(im,m);return c}for(let n=1;n<=100;n++)grid.append(make(n));function toggle(n,c){sel.has(n)?sel.delete(n):sel.add(n);localStorage.setItem('nayaSelected',JSON.stringify([...sel]));document.querySelectorAll('.card[data-n="'+n+'"]').forEach(x=>{x.classList.toggle('selected',sel.has(n));x.querySelector('.pick').textContent=sel.has(n)?'انتخاب شد':'انتخاب'});update();if(modalN===n)document.getElementById('modalpick').textContent=sel.has(n)?'حذف از انتخاب':'انتخاب این طرح'}function update(){tray.classList.toggle('show',sel.size>0);count.textContent=sel.size+' طرح انتخاب شده'}function filter(){let q=document.getElementById('q').value.trim(),shown=0;document.querySelectorAll('.card').forEach(c=>{let n=+c.dataset.n,ok=!q||String(n).includes(q);if(range!=='all')ok=ok&&n>(+range-1)*20&&n<=+range*20;c.style.display=ok?'':'none';if(ok)shown++})}q.oninput=filter;filters.onclick=e=>{if(!e.target.dataset.r)return;range=e.target.dataset.r;[...filters.children].forEach(x=>x.classList.toggle('on',x===e.target));filter()};function openModal(n){modalN=n;big.src=path(n);code.textContent='طرح '+String(n).padStart(3,'0');modalpick.textContent=sel.has(n)?'حذف از انتخاب':'انتخاب این طرح';modal.classList.add('show')}modalpick.onclick=()=>toggle(modalN);close.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};clear.onclick=()=>{sel.clear();localStorage.removeItem('nayaSelected');document.querySelectorAll('.card').forEach(c=>{c.classList.remove('selected');c.querySelector('.pick').textContent='انتخاب'});update()};continue.onclick=()=>location.href='index.html#request';update();</script></body></html>
