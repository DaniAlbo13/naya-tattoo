<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="گالری طرح‌های تتو NAYA Tattoo؛ مشاهده بزرگ، جستجو با شماره و انتخاب چند طرح برای درخواست طراحی اختصاصی."><meta name="robots" content="index,follow"><link rel="canonical" href="https://danialbo13.github.io/naya-tattoo/designs.html"><meta property="og:title" content="گالری طرح‌های تتو | NAYA Tattoo"><meta property="og:description" content="طرح‌های تتو را ببین، بزرگ‌نمایی کن و گزینه‌های موردعلاقه‌ات را انتخاب کن."><meta property="og:type" content="website"><meta property="og:url" content="https://danialbo13.github.io/naya-tattoo/designs.html"><title>گالری طرح‌های تتو | NAYA Tattoo</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.bar{position:sticky;top:0;z-index:20;background:#080808f2;border-bottom:1px solid #292929;padding:12px 3%;display:flex;align-items:center;gap:7px}.brand{font-weight:900;letter-spacing:1.3px;margin-left:auto;white-space:nowrap;font-size:16px}.nav{display:flex;gap:3px;overflow:auto}.nav a{white-space:nowrap;padding:8px 7px;border-radius:10px;color:#bbb;font-size:12px}.nav .active{background:#222;color:#fff}.wrap{width:min(1200px,94%);margin:auto;padding:30px 0 100px}h1{font-size:clamp(32px,7vw,60px);margin:0 0 8px}.lead{color:#aaa;line-height:1.9}.tools{position:sticky;top:55px;z-index:15;background:#080808f2;padding:12px 0}.search{width:100%;padding:13px;border:1px solid #333;border-radius:13px;background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:15px}.card{background:#111;border:1px solid #282828;border-radius:15px;overflow:hidden}.pic{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#181818;cursor:zoom-in}.meta{display:flex;align-items:center;gap:8px;padding:9px}.meta strong{margin-left:auto}.pick{border:1px solid #444;background:#1b1b1b;color:#fff;padding:7px 9px;border-radius:9px}.selected{outline:2px solid #fff}.selected .pick{background:#fff;color:#111}.tray{display:none;position:fixed;z-index:30;bottom:10px;left:10px;right:10px;max-width:650px;margin:auto;background:#171717f5;border:1px solid #444;border-radius:16px;padding:10px;align-items:center;gap:8px}.tray.show{display:flex}.tray strong{margin-left:auto}.tray button{border:0;border-radius:10px;padding:10px}.primary{background:#fff;color:#111}.ghost{background:#292929;color:#fff}.modal{display:none;position:fixed;inset:0;z-index:50;background:#000e;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{width:min(96vw,900px);max-height:96vh;background:#111;border-radius:18px;overflow:auto}.modal img{display:block;width:100%;height:auto;max-height:84vh;object-fit:contain;background:#111}.modalfoot{padding:11px;display:flex;gap:8px;align-items:center}.modalfoot strong{margin-left:auto}.error{display:grid;place-items:center;aspect-ratio:1/1;color:#777;background:#141414;text-align:center;padding:10px}a:focus-visible,button:focus-visible,input:focus-visible,.pic:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.brand{font-size:18px}.nav a{font-size:14px;padding:9px 11px}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}</style><script src="site-config.js"></script></head><body><header class="bar"><a class="brand" id="brand" href="index.html">NAYA TATTOO</a><nav class="nav"><a href="index.html">خانه</a><a class="active" href="designs.html">طرح‌ها</a><a href="index.html#request">درخواست</a></nav></header><main class="wrap"><h1 id="title">طرح‌های تتو</h1><p class="lead" id="lead">گالری طرح‌ها؛ تصویر را بزرگ کن، با شماره جستجو کن و چند گزینه را برای درخواست طراحی اختصاصی انتخاب کن.</p><section class="tools"><input class="search" id="q" inputmode="numeric" aria-label="جستجوی طرح تتو با شماره" placeholder="جستجو با شماره؛ مثلاً 12"></section><section class="grid" id="grid"></section></main><div class="tray" id="tray"><strong id="count"></strong><button class="ghost" id="clear">پاک کردن</button><button class="primary" id="continueBtn">ادامه درخواست</button></div><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="code" aria-describedby="modalHint"><div class="modalbox"><img id="big" alt=""><div class="modalfoot"><strong id="code"></strong><span id="modalHint" hidden>برای بستن پنجره کلید Escape را بزنید.</span><button class="primary" id="modalpick">انتخاب</button><button class="ghost" id="closeBtn">بستن</button></div></div></div><script>const cfg=window.NAYA_CONFIG||{brand:'NAYA TATTOO',designCount:0,designFiles:[]};const total=Math.min(Number(cfg.designCount)||0,Array.isArray(cfg.designFiles)?cfg.designFiles.length:0);const storageKey=cfg.storageKey||'nayaSelected';document.getElementById('brand').textContent=cfg.brand;document.getElementById('title').textContent=total+' طرح تتو';document.getElementById('lead').textContent='گالری '+cfg.brand+'؛ طرح‌های #001 تا #'+String(total).padStart(3,'0')+' را ببین، تصویر را بزرگ کن، با شماره جستجو کن و چند گزینه را برای درخواست طراحی اختصاصی انتخاب کن.';document.title='گالری '+total+' طرح تتو | '+cfg.brand;const grid=document.getElementById('grid'),tray=document.getElementById('tray'),count=document.getElementById('count'),q=document.getElementById('q'),modal=document.getElementById('modal'),big=document.getElementById('big'),code=document.getElementById('code'),modalpick=document.getElementById('modalpick'),clearBtn=document.getElementById('clear'),continueBtn=document.getElementById('continueBtn'),closeBtn=document.getElementById('closeBtn');let saved=[];try{saved=JSON.parse(localStorage.getItem(storageKey)||'[]')}catch(e){localStorage.removeItem(storageKey)}saved=Array.isArray(saved)?saved:[];const sel=new Set(saved.map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=total));let modalN=0,lastFocus=null;const path=n=>'assets/designs/'+cfg.designFiles[n-1];function persist(){localStorage.setItem(storageKey,JSON.stringify([...sel].sort((a,b)=>a-b)))}function make(n){let c=document.createElement('article');c.className='card'+(sel.has(n)?' selected':'');c.dataset.n=n;let im=document.createElement('img');im.className='pic';im.loading=n<=6?'eager':'lazy';im.decoding='async';im.src=path(n);im.alt='طرح تتو '+cfg.brand+' شماره '+String(n).padStart(3,'0');im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','نمایش بزرگ طرح شماره '+String(n).padStart(3,'0'));im.onerror=()=>{let e=document.createElement('div');e.className='error';e.textContent='تصویر '+String(n).padStart(3,'0')+' بارگذاری نشد';im.replaceWith(e)};im.onclick=()=>openModal(n,im);im.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(n,im)}};let m=document.createElement('div');m.className='meta';m.innerHTML='<strong>طرح #'+String(n).padStart(3,'0')+'</strong><button class="pick">'+(sel.has(n)?'انتخاب شد':'انتخاب')+'</button>';m.querySelector('button').onclick=()=>toggle(n);c.append(im,m);return c}for(let n=1;n<=total;n++)grid.append(make(n));function toggle(n){sel.has(n)?sel.delete(n):sel.add(n);persist();document.querySelectorAll('.card[data-n="'+n+'"]').forEach(x=>{x.classList.toggle('selected',sel.has(n));const b=x.querySelector('.pick');if(b)b.textContent=sel.has(n)?'انتخاب شد':'انتخاب'});update();if(modalN===n)modalpick.textContent=sel.has(n)?'حذف از انتخاب':'انتخاب این طرح'}function update(){tray.classList.toggle('show',sel.size>0);count.textContent=sel.size+' طرح انتخاب شده'}function filter(){let v=q.value.trim().replace(/^0+/,'');document.querySelectorAll('.card').forEach(c=>{let n=+c.dataset.n;c.style.display=!v||String(n)===v?'':'none'})}q.oninput=filter;function openModal(n,trigger){modalN=n;lastFocus=trigger||document.activeElement;big.src=path(n);big.alt='طرح تتو '+cfg.brand+' شماره '+String(n).padStart(3,'0');code.textContent='طرح #'+String(n).padStart(3,'0');modalpick.textContent=sel.has(n)?'حذف از انتخاب':'انتخاب این طرح';modal.classList.add('show');document.body.style.overflow='hidden';closeBtn.focus()}function closeModal(){if(!modal.classList.contains('show'))return;modal.classList.remove('show');document.body.style.overflow='';big.removeAttribute('src');modalN=0;const target=lastFocus;lastFocus=null;if(target&&document.contains(target))target.focus()}function trapModalFocus(e){if(e.key!=='Tab'||!modal.classList.contains('show'))return;const items=[...modal.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}modalpick.onclick=()=>modalN&&toggle(modalN);closeBtn.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show')){e.preventDefault();closeModal();return}trapModalFocus(e)});clearBtn.onclick=()=>{sel.clear();localStorage.removeItem(storageKey);document.querySelectorAll('.card').forEach(c=>{c.classList.remove('selected');const b=c.querySelector('.pick');if(b)b.textContent='انتخاب'});update()};continueBtn.onclick=()=>location.href='index.html#request';persist();update();</script></body></html>
