<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طرح‌های تتو | NAYA Tattoo</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.bar{position:sticky;top:0;z-index:20;background:#080808f2;border-bottom:1px solid #292929;padding:12px 4%;display:flex;align-items:center;gap:14px}.brand{font-weight:900;letter-spacing:2px;margin-left:auto}.nav{display:flex;gap:8px;overflow:auto}.nav a{white-space:nowrap;padding:9px 11px;border-radius:10px;color:#bbb}.nav .active{background:#222;color:#fff}.wrap{width:min(1200px,94%);margin:auto;padding:30px 0 100px}h1{font-size:clamp(32px,7vw,60px);margin:0 0 8px}.lead{color:#aaa}.tools{position:sticky;top:57px;z-index:15;background:#080808f2;padding:12px 0}.search{width:100%;padding:13px;border:1px solid #333;border-radius:13px;background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:15px}.card{background:#111;border:1px solid #282828;border-radius:15px;overflow:hidden}.pic{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#181818;cursor:zoom-in}.meta{display:flex;align-items:center;gap:8px;padding:9px}.meta strong{margin-left:auto}.pick{border:1px solid #444;background:#1b1b1b;color:#fff;padding:7px 9px;border-radius:9px}.selected{outline:2px solid #fff}.selected .pick{background:#fff;color:#111}.tray{display:none;position:fixed;z-index:30;bottom:10px;left:10px;right:10px;max-width:650px;margin:auto;background:#171717f5;border:1px solid #444;border-radius:16px;padding:10px;align-items:center;gap:8px}.tray.show{display:flex}.tray strong{margin-left:auto}.tray button{border:0;border-radius:10px;padding:10px}.primary{background:#fff;color:#111}.ghost{background:#292929;color:#fff}.modal{display:none;position:fixed;inset:0;z-index:50;background:#000e;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{width:min(96vw,900px);max-height:96vh;background:#111;border-radius:18px;overflow:auto}.modal img{display:block;width:100%;height:auto;max-height:84vh;object-fit:contain;background:#111}.modalfoot{padding:11px;display:flex;gap:8px;align-items:center}.modalfoot strong{margin-left:auto}.error{display:grid;place-items:center;aspect-ratio:1/1;color:#777;background:#141414;text-align:center;padding:10px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header class="bar"><a class="brand" href="index.html">NAYA TATTOO</a><nav class="nav"><a href="index.html">خانه</a><a class="active" href="designs.html">طرح‌های تتو</a><a href="index.html#request">درخواست طراحی</a></nav></header><main class="wrap"><h1>۲۰ طرح تتو</h1><p class="lead">طرح‌های #001 تا #020 به‌صورت مستقل. شماره را جستجو کن، تصویر را بزرگ ببین و طرح‌های موردنظرت را انتخاب کن.</p><section class="tools"><input class="search" id="q" inputmode="numeric" placeholder="جستجو با شماره؛ مثلاً 12"></section><section class="grid" id="grid"></section></main><div class="tray" id="tray"><strong id="count"></strong><button class="ghost" id="clear">پاک کردن</button><button class="primary" id="continueBtn">ادامه درخواست</button></div><div class="modal" id="modal"><div class="modalbox"><img id="big" alt=""><div class="modalfoot"><strong id="code"></strong><button class="primary" id="modalpick">انتخاب</button><button class="ghost" id="closeBtn">بستن</button></div></div></div><script>const grid=document.getElementById('grid'),tray=document.getElementById('tray'),count=document.getElementById('count'),q=document.getElementById('q'),modal=document.getElementById('modal'),big=document.getElementById('big'),code=document.getElementById('code'),modalpick=document.getElementById('modalpick'),clearBtn=document.getElementById('clear'),continueBtn=document.getElementById('continueBtn'),closeBtn=document.getElementById('closeBtn'),sel=new Set(JSON.parse(localStorage.getItem('nayaSelected')||'[]').filter(n=>n<=20));let modalN=0;const files={1:'file_00000000d0dc8210a3cf1119ae434397.png',2:'file_00000000f7c88210a80e5b538a435203.png',3:'file_0000000092008210a14e8d05a111ffdc.png',4:'file_0000000015b081f79f869e8cf6e749f3.png',5:'file_00000000ab0081f7befbfe7581b7723a.png',6:'file_00000000257481f5ab457e99815ded3c.png',7:'file_000000006d8481f4b9d7d67a6d7c3596.png',8:'file_00000000bde88243a4b78f3c250c8320.png',9:'file_00000000952481f4a654640e26d08004.png',10:'file_000000005e5c824695ba10ab37bf779a.png',11:'file_0000000038d882469d71de9864bcd68f.png',12:'file_00000000c65882109415ffeaeb6df64e.png',13:'file_00000000c780821086b7550a5b8addd5.png',14:'file_0000000067c0824385ce5339add0ee1d.png',15:'file_00000000d8b88246a75ffeb40f04c982.png',16:'file_000000001c1482109c75bdadac9071d5.png',17:'file_000000001948820abd05f8f26cff7e0c.png',18:'file_00000000d468820a83c581f248834f7e.png',19:'file_00000000f4c48243926afb3c91077de7.png',20:'file_0000000043508246bc7b87a476dde2a6.png'};const path=n=>'assets/designs/'+files[n];function make(n){let c=document.createElement('article');c.className='card'+(sel.has(n)?' selected':'');c.dataset.n=n;let im=document.createElement('img');im.className='pic';im.loading=n<=6?'eager':'lazy';im.decoding='async';im.src=path(n);im.alt='طرح تتو '+String(n).padStart(3,'0');im.onerror=()=>{let e=document.createElement('div');e.className='error';e.textContent='تصویر '+String(n).padStart(3,'0')+' بارگذاری نشد';im.replaceWith(e)};im.onclick=()=>openModal(n);let m=document.createElement('div');m.className='meta';m.innerHTML='<strong>طرح #'+String(n).padStart(3,'0')+'</strong><button class="pick">'+(sel.has(n)?'انتخاب شد':'انتخاب')+'</button>';m.querySelector('button').onclick=()=>toggle(n);c.append(im,m);return c}for(let n=1;n<=20;n++)grid.append(make(n));function toggle(n){sel.has(n)?sel.delete(n):sel.add(n);localStorage.setItem('nayaSelected',JSON.stringify([...sel]));document.querySelectorAll('.card[data-n="'+n+'"]').forEach(x=>{x.classList.toggle('selected',sel.has(n));x.querySelector('.pick').textContent=sel.has(n)?'انتخاب شد':'انتخاب'});update();if(modalN===n)modalpick.textContent=sel.has(n)?'حذف از انتخاب':'انتخاب این طرح'}function update(){tray.classList.toggle('show',sel.size>0);count.textContent=sel.size+' طرح انتخاب شده'}function filter(){let v=q.value.trim().replace(/^0+/,'');document.querySelectorAll('.card').forEach(c=>{let n=+c.dataset.n;c.style.display=!v||String(n)===v?'':'none'})}q.oninput=filter;function openModal(n){modalN=n;big.src=path(n);code.textContent='طرح #'+String(n).padStart(3,'0');modalpick.textContent=sel.has(n)?'حذف از انتخاب':'انتخاب این طرح';modal.classList.add('show')}modalpick.onclick=()=>toggle(modalN);closeBtn.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};clearBtn.onclick=()=>{sel.clear();localStorage.removeItem('nayaSelected');document.querySelectorAll('.card').forEach(c=>{c.classList.remove('selected');c.querySelector('.pick').textContent='انتخاب'});update()};continueBtn.onclick=()=>location.href='index.html#request';update();</script></body></html>
