<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>طرح‌های تتو | NAYA Tattoo</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f4f4f4;font-family:Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}header{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.94);backdrop-filter:blur(14px);border-bottom:1px solid #262626}.bar{max-width:1200px;margin:auto;padding:12px 16px;display:flex;gap:12px;align-items:center}.brand{font-weight:900;letter-spacing:2px;font-size:20px;margin-left:auto}.nav{display:flex;gap:8px;overflow:auto}.nav a{padding:9px 12px;border-radius:12px;color:#bbb;white-space:nowrap}.nav a.active,.nav a:hover{background:#1c1c1c;color:white}.wrap{max-width:1200px;margin:auto;padding:24px 14px 110px}.hero{padding:14px 2px 24px}.hero h1{font-size:clamp(30px,7vw,56px);margin:0 0 10px}.hero p{color:#aaa;line-height:1.9;margin:0}.tools{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0;position:sticky;top:62px;z-index:15;background:linear-gradient(#080808 85%,transparent);padding:10px 0 14px}.search{width:100%;background:#111;border:1px solid #2c2c2c;color:#fff;border-radius:14px;padding:13px}.filters{display:flex;gap:8px;overflow:auto}.filters button{border:1px solid #303030;background:#121212;color:#bbb;border-radius:999px;padding:9px 12px;white-space:nowrap}.filters button.on{background:#f1f1f1;color:#111;border-color:#f1f1f1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#111;border:1px solid #252525;border-radius:16px;overflow:hidden;position:relative;cursor:pointer}.pic{aspect-ratio:1/5;background:#151515 center top/1000% 1000% no-repeat;position:relative}.pic:after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,rgba(0,0,0,.72))}.meta{padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.code{font-weight:800}.pick{border:1px solid #444;background:#1a1a1a;color:white;border-radius:10px;padding:7px 9px}.card.selected{outline:2px solid #fff;outline-offset:-2px}.card.selected .pick{background:white;color:#111}.empty{display:none;text-align:center;color:#888;padding:50px}.tray{position:fixed;z-index:30;left:10px;right:10px;bottom:10px;max-width:700px;margin:auto;background:rgba(20,20,20,.96);border:1px solid #393939;border-radius:18px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 12px 35px #000}.tray.show{display:flex}.tray strong{margin-left:auto}.tray button{border:0;border-radius:12px;padding:10px 13px}.primary{background:#fff;color:#111}.ghost{background:#272727;color:#fff}.modal{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{width:min(92vw,430px);max-height:92vh;background:#111;border:1px solid #333;border-radius:20px;overflow:hidden}.modalpic{width:100%;aspect-ratio:1/5;background:#fff center top/1000% 1000% no-repeat}.modalfoot{padding:12px;display:flex;gap:8px;align-items:center}.modalfoot strong{margin-left:auto}.close{background:#292929;color:white;border:0;border-radius:11px;padding:10px 12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.tools{grid-template-columns:minmax(260px,1fr) 2fr;align-items:center}}@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header><div class="bar"><a class="brand" href="index.html">NAYA TATTOO</a><nav class="nav"><a href="index.html">خانه</a><a class="active" href="designs.html">طرح‌های تتو</a><a href="index.html#request">درخواست طراحی</a></nav></div></header><main class="wrap"><section class="hero"><h1>۱۰۰ طرح تتو، انتخاب ساده‌تر</h1><p>هر طرح جداگانه نمایش داده می‌شود. روی هر طرح بزن، بزرگ‌نمایی کن و طرح‌های موردعلاقه‌ات را انتخاب کن.</p></section><section class="tools"><input id="q" class="search" inputmode="numeric" placeholder="جستجو با شماره طرح؛ مثلا 23"><div class="filters" id="filters"><button class="on" data-r="all">همه ۱۰۰ طرح</button><button data-r="1">01–20</button><button data-r="2">21–40</button><button data-r="3">41–60</button><button data-r="4">61–80</button><button data-r="5">81–100</button></div></section><section id="grid" class="grid"></section><div id="empty" class="empty">طرحی با این شماره پیدا نشد.</div></main><div id="tray" class="tray"><strong id="count">۰ طرح انتخاب شده</strong><button class="ghost" id="clear">پاک کردن</button><button class="primary" id="continue">ادامه درخواست</button></div><div id="modal" class="modal"><div class="modalbox"><div id="modalpic" class="modalpic"></div><div class="modalfoot"><strong id="modalcode"></strong><button id="modalpick" class="primary">انتخاب این طرح</button><button id="close" class="close">بستن</button></div></div></div><script>
const SPR='assets/naya-100.jpg';const grid=document.getElementById('grid'),sel=new Set(JSON.parse(localStorage.getItem('nayaSelected')||'[]'));let range='all',modalN=null;function pos(n){const j=n-1,x=j%10,y=Math.floor(j/10);return `${x*100/9}% ${y*100/9}%`}function card(n){const d=document.createElement('article');d.className='card'+(sel.has(n)?' selected':'');d.dataset.n=n;d.innerHTML=`<div class="pic"></div><div class="meta"><span class="code">طرح ${String(n).padStart(3,'0')}</span><button class="pick">${sel.has(n)?'انتخاب شد':'انتخاب'}</button></div>`;const pic=d.querySelector('.pic');pic.style.backgroundImage=`url('${SPR}')`;pic.style.backgroundPosition=pos(n);d.querySelector('.pick').onclick=e=>{e.stopPropagation();toggle(n,d)};d.onclick=()=>openModal(n);return d}for(let n=1;n<=100;n++)grid.append(card(n));function toggle(n,node){sel.has(n)?sel.delete(n):sel.add(n);localStorage.setItem('nayaSelected',JSON.stringify([...sel]));if(node){node.classList.toggle('selected',sel.has(n));node.querySelector('.pick').textContent=sel.has(n)?'انتخاب شد':'انتخاب'}document.querySelectorAll(`.card[data-n="${n}"]`).forEach(x=>{x.classList.toggle('selected',sel.has(n));x.querySelector('.pick').textContent=sel.has(n)?'انتخاب شد':'انتخاب'});updateTray();if(modalN===n)document.getElementById('modalpick').textContent=sel.has(n)?'حذف از انتخاب':'انتخاب این طرح'}function updateTray(){document.getElementById('tray').classList.toggle('show',sel.size>0);document.getElementById('count').textContent=`${sel.size} طرح انتخاب شده`}function filter(){const q=document.getElementById('q').value.trim();let shown=0;document.querySelectorAll('.card').forEach(c=>{const n=+c.dataset.n;let ok=!q||String(n).includes(q);if(range!=='all'){const a=(+range-1)*20+1,b=+range*20;ok=ok&&n>=a&&n<=b}c.style.display=ok?'':'none';if(ok)shown++});document.getElementById('empty').style.display=shown?'none':'block'}document.getElementById('q').oninput=filter;document.getElementById('filters').onclick=e=>{if(!e.target.dataset.r)return;range=e.target.dataset.r;[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));filter()};function openModal(n){modalN=n;document.getElementById('modalcode').textContent=`طرح ${String(n).padStart(3,'0')}`;const p=document.getElementById('modalpic');p.style.backgroundImage=`url('${SPR}')`;p.style.backgroundPosition=pos(n);document.getElementById('modalpick').textContent=sel.has(n)?'حذف از انتخاب':'انتخاب این طرح';document.getElementById('modal').classList.add('show')}document.getElementById('modalpick').onclick=()=>toggle(modalN);document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};document.getElementById('clear').onclick=()=>{sel.clear();localStorage.removeItem('nayaSelected');document.querySelectorAll('.card').forEach(c=>{c.classList.remove('selected');c.querySelector('.pick').textContent='انتخاب'});updateTray()};document.getElementById('continue').onclick=()=>{location.href='index.html#request'};updateTray();
const probe=new Image();probe.onerror=()=>{document.querySelectorAll('.pic,.modalpic').forEach(p=>{p.style.backgroundImage='linear-gradient(145deg,#171717,#0d0d0d)'})};probe.src=SPR;
</script></body></html>
